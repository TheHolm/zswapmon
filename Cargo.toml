[package]
name = "zswapmon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Utility for monitoring zswap status and statistics"
authors = ["VHSgunzo <vhsgunzo@gmail.com>"]
license = "MIT"
repository = "https://github.com/TheHolm/zswapmon"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"

# Debian/Ubuntu package (cargo-deb). Built from the static musl binary, so it has
# no runtime dependencies and installs on Debian 12+ / Ubuntu 22.04+ / Pi OS.
# MIT text ends up once, in /usr/share/doc/zswapmon/copyright (Policy 12.5).
[package.metadata.deb]
maintainer = "TheHolm <16282750+TheHolm@users.noreply.github.com>"
copyright = "2026 VHSgunzo"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = ""
extended-description = """\
zswapmon shows Linux zswap compressed swap cache status, statistics and \
kernel parameters, with an optional continuous monitoring mode."""
assets = [
    ["target/release/zswapmon", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/zswapmon/", "644"],
]

[profile.release]
lto = true
opt-level = "z"
strip = "symbols"
debug  = false
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
